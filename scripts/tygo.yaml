# TypeScript for the web app from the Go types that are the wire contract
# (bash scripts/gen-types.sh). A REST slice whose types the web app uses adds its package here.
packages:
  - path: "streamiq/protocol"
    output_path: "frontend/src/generated/protocol.ts"
    frontmatter: |
      export type Role = 'admin' | 'member'
      /** What a browser sends on /api/broker/ws. */
      export type BrowserMessage =
        | Auth
        | Offer<RTCSessionDescriptionInit>
        | Ice<RTCIceCandidateInit>
        | Ping
      /** What a browser gets on /api/broker/ws. */
      export type BrokerMessage =
        | Ready
        | Answer<RTCSessionDescriptionInit>
        | Ice<RTCIceCandidateInit>
        | ErrorMsg
  - path: "streamiq/api/internal/auth"
    output_path: "frontend/src/generated/auth.ts"
    include_files: ["household.go"]
    optional_type: "null"
  - path: "streamiq/api/internal/me"
    output_path: "frontend/src/generated/me.ts"
    optional_type: "null"
    type_mappings:
      auth.Household: "auth.Household"
    frontmatter: |
      import type * as auth from './auth'
  - path: "streamiq/api/internal/gateways"
    output_path: "frontend/src/generated/gateways.ts"
    include_files: ["list.go"]
    optional_type: "null"
    type_mappings:
      time.Time: "string"
  - path: "streamiq/api/internal/onboarding"
    output_path: "frontend/src/generated/onboarding.ts"
    include_files: ["token.go"]
    optional_type: "null"
    type_mappings:
      time.Time: "string"
  - path: "streamiq/api/internal/relayusage"
    output_path: "frontend/src/generated/relayusage.ts"
    include_files: ["relayusage.go"]
    optional_type: "null"
  - path: "streamiq/api/internal/household"
    output_path: "frontend/src/generated/household.ts"
    include_files: ["create.go", "rename.go"]
    optional_type: "null"
  - path: "streamiq/api/internal/members"
    output_path: "frontend/src/generated/members.ts"
    include_files: ["list.go"]
    optional_type: "null"
    type_mappings:
      time.Time: "string"
  - path: "streamiq/api/internal/invites"
    output_path: "frontend/src/generated/invites.ts"
    include_files: ["create.go", "list.go", "preview.go", "accept.go"]
    optional_type: "null"
    type_mappings:
      time.Time: "string"
  # The gateway ↔ browser contracts (over the tunnel): the auth channel and the gateway API.
  - path: "streamiq/gateway/internal/sessions"
    output_path: "frontend/src/generated/sessions.ts"
    include_files: ["messages.go"]
    frontmatter: |
      /** What the gateway sends on the `auth` data channel. */
      export type GatewayAuthMessage = Challenge | OK | Unpaired | Nonce | Approved | Rejected
      /** What a client sends on the `auth` data channel. */
      export type ClientAuthMessage = Auth | Commit | Reveal
  - path: "streamiq/gateway/internal/tunnel"
    output_path: "frontend/src/generated/tunnel.ts"
    include_files: ["types.go"]
  - path: "streamiq/gateway/internal/screen"
    output_path: "frontend/src/generated/screen.ts"
    include_files: ["types.go"]
    frontmatter: |
      /** A phone → TV screen command. */
      export type ScreenCommand =
        | PlayCommand
        | PauseCommand
        | ResumeCommand
        | StopCommand
        | SeekCommand
        | TracksCommand
  - path: "streamiq/gateway/internal/pairing"
    output_path: "frontend/src/generated/pairing.ts"
    include_files: ["types.go"]
    type_mappings:
      time.Time: "string"
  - path: "streamiq/gateway/internal/onboarding"
    output_path: "frontend/src/generated/gateway-onboarding.ts"
    include_files: ["types.go"]
  - path: "streamiq/gateway/internal/update"
    output_path: "frontend/src/generated/update.ts"
    include_files: ["types.go"]
  - path: "streamiq/gateway/internal/history"
    output_path: "frontend/src/generated/history.ts"
    include_files: ["types.go"]
    optional_type: "null"
    type_mappings:
      time.Time: "string"
      tunnel.Playback: "tunnel.Playback"
    frontmatter: |
      import type * as tunnel from './tunnel'

  - path: "streamiq/gateway/internal/host"
    output_path: "frontend/src/generated/host.ts"
    include_files: ["load.go"]
  - path: "streamiq/gateway/internal/jellyfin"
    output_path: "frontend/src/generated/jellyfin.ts"
    include_files: ["viewer.go", "librarytypes.go"]
  - path: "streamiq/gateway/cmd/gateway"
    output_path: "frontend/src/generated/status.ts"
    include_files: ["status.go"]
    type_mappings:
      time.Time: "string"
      host.Load: "host.Load"
      jellyfin.ViewerStatus: "jellyfin.ViewerStatus"
    frontmatter: |
      import type * as host from './host'
      import type * as jellyfin from './jellyfin'
