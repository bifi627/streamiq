# Gateway release. Two ways in (#274):
# - automatic: ci.yml calls this as its last job, after every check passed on a push to
#   main that changed gateway/** (and whose subject has no `[skip release]`). The version
#   comes from scripts/next-gateway-version.sh: highest stable tag, a breaking `type!:`
#   subject bumps the minor, anything else the patch.
# - by hand: pushing a tag gateway-vX.Y.Z releases that version: the only way to bump the
#   major; later automatic releases build on it.
# Either way it builds the native binaries and publishes them as a GitHub Release, which
# is what install.sh / install.ps1 download and the gateway's update notice checks.
# Tags with a suffix (gateway-v1.5.0-nightly.3) become prereleases, which "latest"
# and the automatic version skip (issue #48).
name: release-gateway
on:
  push:
    tags: ['gateway-v*']
  workflow_call:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release + its tag; nothing else
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags + history for the stale/already-released checks
      - uses: actions/setup-go@v7
        with:
          go-version-file: gateway/go.mod
      - run: go vet ./... && go test ./...
        working-directory: gateway
      - name: version
        id: version
        env:
          MSG: ${{ github.event.head_commit.message }} # via env, never inlined into the script
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#gateway-v}"
          else
            # already released (a re-run, or the owner tagged this commit by hand): nothing to do
            done=$(git tag -l 'gateway-v*' --points-at HEAD)
            if [ -n "$done" ]; then echo "::notice::already released as $done"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            # a release of a newer commit exists (a re-run of an older merge): never publish older code as Latest
            newer=$(git tag -l 'gateway-v*' --no-merged HEAD | grep -E '^gateway-v[0-9]+\.[0-9]+\.[0-9]+$' || true)
            if [ -n "$newer" ]; then echo "::error::newer release(s) exist: $newer; not releasing this older commit"; exit 1; fi
            v=$(git tag -l 'gateway-v*' | bash scripts/next-gateway-version.sh "$MSG")
          fi
          echo "version: $v"
          echo "V=$v" >> "$GITHUB_ENV"
      - name: build
        if: steps.version.outputs.skip != 'true'
        working-directory: gateway
        run: |
          mkdir -p ../dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${t%/*}" arch="${t#*/}" ext=""
            [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$V" -o "../dist/streamiq-gateway-$os-$arch$ext" ./cmd/gateway
          done
          cp install/install.sh install/install.ps1 install/jellyfin-compose.yml ../dist/
          (cd ../dist && sha256sum streamiq-gateway-* jellyfin-compose.yml > SHA256SUMS)
      - name: publish
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$V" in *-*) pre="--prerelease" ;; esac
          # --target: a new tag goes on the commit that was built, not on main's head
          gh release create "gateway-v$V" dist/* --target "$GITHUB_SHA" --generate-notes $pre
