# Gateway release. Two triggers (#274):
# - a merge to main that changes gateway/** releases automatically: the version comes
#   from scripts/next-gateway-version.sh (highest stable tag; a breaking `type!:` subject
#   bumps the minor, anything else the patch). `[skip release]` in the commit message skips it.
# - pushing a tag gateway-vX.Y.Z by hand releases that version: the only way to bump the
#   major; later automatic releases build on it. Path filters don't apply to tag pushes.
# Either way it builds the native binaries and publishes them as a GitHub Release, which
# is what install.sh / install.ps1 download and the gateway's update notice checks.
# Tags with a suffix (gateway-v1.5.0-nightly.3) become prereleases, which "latest"
# and the automatic version skip (issue #48).
name: release-gateway
on:
  push:
    branches: [main]
    paths: ['gateway/**']
    tags: ['gateway-v*']

permissions:
  contents: read

# ponytail: one release at a time so two quick merges can't pick the same version. GitHub keeps
# only the newest pending run per group, so a merge queued behind a running release is folded
# into the next one (its `!` minor bump lost if the next subject has none); re-tag by hand then.
concurrency:
  group: release-gateway
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_type == 'tag' || !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release + its tag; nothing else
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: gateway/go.mod
      - run: go vet ./... && go test ./...
        working-directory: gateway
      - name: version
        env:
          MSG: ${{ github.event.head_commit.message }} # via env, never inlined into the script
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#gateway-v}"
          else
            bash scripts/next-gateway-version.sh test
            v=$(git ls-remote --tags --refs origin 'gateway-v*' | bash scripts/next-gateway-version.sh "$MSG")
          fi
          echo "version: $v"
          echo "V=$v" >> "$GITHUB_ENV"
      - name: build
        working-directory: gateway
        run: |
          mkdir -p ../dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${t%/*}" arch="${t#*/}" ext=""
            [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$V" -o "../dist/streamiq-gateway-$os-$arch$ext" ./cmd/gateway
          done
          cp install/install.sh install/install.ps1 install/jellyfin-compose.yml ../dist/
          (cd ../dist && sha256sum streamiq-gateway-* jellyfin-compose.yml > SHA256SUMS)
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$V" in *-*) pre="--prerelease" ;; esac
          # --target: a new tag goes on the commit that was built, not on main's head
          gh release create "gateway-v$V" dist/* --target "$GITHUB_SHA" --generate-notes $pre
