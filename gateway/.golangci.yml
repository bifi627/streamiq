version: "2"
run:
  # one golangci-lint lock per machine (os.TempDir): wait for it instead of failing after
  # 5 s, so check.sh keeps running concurrently across worktrees
  allow-serial-runners: true
linters:
  # the default set: errcheck, govet, ineffassign, staticcheck, unused; plus gocyclo (#542), funlen (#600)
  # and gosec, limited to the HTTP-server checks below (#634)
  enable: [gocyclo, funlen, gosec]
  exclusions:
    # errcheck skips Close, fmt.Fprint*, os.Remove*, os.Setenv and the like (#560); test
    # files are checked too
    presets: [std-error-handling]
    rules:
      # table tests are long by design; every other linter still checks test files
      - path: _test\.go
        linters: [gocyclo, funlen]
  settings:
    gosec:
      # G112: an http.Server without ReadHeaderTimeout; G114: a bare http.ListenAndServe/Serve
      # (no timeouts at all). Only these two: the rest of gosec is a separate decision.
      includes: [G112, G114]
    gocyclo:
      # reports a function over 15, like oxlint's complexity (#533) and CA1502 (#540);
      # split into pieces that take and return values. A //nolint:gocyclo needs a reason.
      min-complexity: 15
    funlen:
      # a function over 80 lines (about one screen), comments not counted (#600); the frontend's
      # limit is 150. A //nolint:funlen names the issue that splits it or the reason it stays.
      lines: 80
      statements: -1
      ignore-comments: true
    staticcheck:
      # golangci-lint's default checks (setting the list replaces them, so they're restated) ...
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022",
        # ... minus ST1005 (lowercase error strings): ours are capitalized CLI messages the
        # user reads as is ("Jellyfin …", "Docker …"), not strings wrapped inside other errors
        "-ST1005"]
formatters:
  # #601: gofmt never wraps; golines wraps at 120 columns (long string literals stay whole).
  # `golangci-lint run` (check.sh, CI) reports unformatted files; `golangci-lint fmt ./...` (from gateway/) fixes
  # them; rerun it until git shows no change: a long condition can take two or three passes.
  enable: [golines]
  settings:
    golines:
      max-len: 120
