# Same checks as scripts/check.sh — if they disagree, that's a harness bug. CI is authoritative.
# Job names api / frontend / gateway-linux / gateway-windows / gateway-jellyfin / e2e are required checks in
# the "main: merge gate" ruleset: renaming, removing or matrix-splitting one (or a workflow-level `paths:` filter)
# leaves PRs waiting forever. Update the ruleset in the same PR. Skip with job `if:` only.
name: ci
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Least privilege for every job: checkout only. upload-artifact uses the runtime
# token, not GITHUB_TOKEN. Widen per job, never here.
permissions:
  contents: read

# A proxy error (not only 404/410) falls back to fetching from the origin. -count=1: the build
# cache is kept per job (.github/actions/setup-go), and a cached `go test` result would skip the
# tests whose inputs Go can't see (Docker, the real Jellyfin).
env:
  GOPROXY: https://proxy.golang.org|direct
  GOFLAGS: -count=1

# A new push to a PR cancels that PR's older run. Pushes to main each get their own group
# (run_id): GitHub keeps only one pending run per group, so a shared group could drop a
# main run, and with it its gateway release.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Drafts skip CI; ready_for_review runs it. The PR's live draft state, not the event's:
  # a push right before "ready for review" carries draft=true, and its skipped checks, newer
  # than the ready run's, satisfied the required checks while e2e still ran (#631 merged so).
  # An API failure counts as "not a draft": run CI rather than skip it (a skipped job passes the gate).
  draft:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      draft: ${{ steps.d.outputs.draft }}
    steps:
      - id: d
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: echo "draft=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft || echo false)" >> "$GITHUB_OUTPUT"

  api:
    needs: draft
    if: ${{ !cancelled() && needs.draft.outputs.draft != 'true' }} # a failed draft job runs CI: skipped would pass the merge gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - run: bash scripts/docker-pull.sh postgres "$(sed -n 's/^FROM //p' dev/firebase/Dockerfile)" # + the emulator build's base
      - run: bash scripts/test-api.sh -race
      - run: docker compose config --quiet && docker compose --profile relay config --quiet

  frontend:
    needs: draft
    if: ${{ !cancelled() && needs.draft.outputs.draft != 'true' }} # a failed draft job runs CI: skipped would pass the merge gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/check-jellyfin-paths.sh # #557: Jellyfin paths only in features/library/jellyfin.ts
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm ci # the e2e typecheck needs its types (@playwright/test, @types/node)
        working-directory: e2e
      - run: npm run format:check
        working-directory: frontend
      - run: ../frontend/node_modules/.bin/prettier --check . # e2e has no own prettier; borrow frontend's
        working-directory: e2e
      - run: ../frontend/node_modules/.bin/tsc -p . # #581: typecheck e2e (Playwright strips types); borrowed tsc
        working-directory: e2e
      - run: npm run lint
        working-directory: frontend
      - run: ../frontend/node_modules/.bin/oxlint --report-unused-disable-directives-severity=error # borrowed oxlint, e2e/.oxlintrc.json
        working-directory: e2e
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  gateway-linux:
    needs: draft
    if: ${{ !cancelled() && needs.draft.outputs.draft != 'true' }} # a failed draft job runs CI: skipped would pass the merge gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - run: bash scripts/next-gateway-version.sh --test # #274: release-gateway's version bump
      - run: bash scripts/check-docs-drift.sh # #488: STREAMIQ_* env vars, gateway routes, message types documented
      - run: bash scripts/check-file-size.sh # #600: no source file over 500 code lines (frontend + Go) outside the allowlist
      - run: bash scripts/check-comments.sh
      - run: bash scripts/check-migrations.sh # squawk on the migrations not applied yet
      - run: bash scripts/gen-types.sh --check # frontend/src/generated matches the Go wire types (Go + the frontend tree)
      # #581: actionlint (+ shellcheck on run: blocks) and shellcheck scripts/*.sh + the installer, pinned like scripts/check.sh
      - run: bash scripts/docker-pull.sh rhysd/actionlint:1.7.12
      - run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -no-color
          docker run --rm -v "$PWD:/repo" -w /repo --entrypoint shellcheck rhysd/actionlint:1.7.12 scripts/*.sh gateway/install/install.sh
      # every Go package of the module (gateway, API, protocol), with no list of folders
      - run: test -z "$(bash scripts/go-sources.sh --all | xargs gofmt -l)" || { echo "gofmt needed:"; bash scripts/go-sources.sh --all | xargs gofmt -l; exit 1; }
      # #559: golangci-lint (its govet replaces go vet), pinned like scripts/check.sh
      - run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./... && go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run --build-tags docker ./gateway/...
      - run: go build ./... && go test -race ./...
        working-directory: gateway

  # #452: Windows-only code (service, update, rollback) runs here; the update test
  # starts from the last release's real binary.
  gateway-windows:
    needs: draft
    if: ${{ !cancelled() && needs.draft.outputs.draft != 'true' }} # a failed draft job runs CI: skipped would pass the merge gate
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: gateway
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - run: gh release download --repo "$GITHUB_REPOSITORY" --pattern streamiq-gateway-windows-amd64.exe --dir "$RUNNER_TEMP"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          race=; [ "$(go env CGO_ENABLED)" = 1 ] && race=-race
          (cd .. && go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...) && go build ./... && go test $race ./...
        env:
          STREAMIQ_TEST_OLD_GATEWAY: ${{ runner.temp }}/streamiq-gateway-windows-amd64.exe

  # #453: backup → restore against the real pinned Jellyfin (Docker), and a backup made
  # by the last release's pin restored into the current one.
  gateway-jellyfin:
    needs: draft
    if: ${{ !cancelled() && needs.draft.outputs.draft != 'true' }} # a failed draft job runs CI: skipped would pass the merge gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - run: gh release download --repo "$GITHUB_REPOSITORY" --pattern jellyfin-compose.yml --dir "$RUNNER_TEMP"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: bash ../scripts/docker-pull.sh -f gateway/install/jellyfin-compose.yml jellyfin/jellyfin alpine/socat && bash ../scripts/docker-pull.sh -f "$RUNNER_TEMP/jellyfin-compose.yml" jellyfin/jellyfin alpine/socat
      - run: go test -tags docker -run TestRealJellyfin -v -timeout 15m ./internal/jellyfin/
        env:
          STREAMIQ_TEST_OLD_JELLYFIN_COMPOSE: ${{ runner.temp }}/jellyfin-compose.yml

  # The e2e specs (smoke, multi-user, households, compat: the last gateway release), 3 workers on one stack (no sharding:
  # e2e/playwright.config.ts). Containers via testcontainers-node, API/Vite/gateway as
  # real processes — see e2e/global-setup.ts.
  e2e:
    needs: draft
    if: ${{ !cancelled() && needs.draft.outputs.draft != 'true' }} # a failed draft job runs CI: skipped would pass the merge gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # The Jellyfins are global setup's critical path once the emulator comes from the cache (#504):
      # pull the pinned images in the background while the next steps run; "image pulls" waits for it.
      - run: bash scripts/docker-pull.sh jellyfin/jellyfin postgres coturn/coturn > "$RUNNER_TEMP/pull.log" 2>&1 & echo $! > "$RUNNER_TEMP/pull.pid"
      - uses: ./.github/actions/setup-go
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      # ponytail: no `playwright install --with-deps chrome`: the runner image ships Google Chrome
      # (channel 'chrome'), and that step's apt run failed whenever the Ubuntu mirrors were down (#157).
      - run: /opt/google/chrome/chrome --version  # the binary Playwright's channel 'chrome' launches on Linux
      # chrome87.spec.ts downloads the pinned Chromium 87 (~130 MB) into this dir; its path names the pin.
      - uses: actions/cache@v6
        with:
          path: e2e/.bin/chromium87
          key: chromium87-${{ hashFiles('e2e/chrome87.spec.ts') }}
      # The Firebase emulator image (dev/firebase) took 72 of global setup's 79 s to build (#504):
      # cached as a `docker save` tar, keyed by the same files its tag hashes (emulatorImage in
      # e2e/stack.ts). Its base image is pinned exactly, so the key covers everything in it.
      - id: emulator
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/emulator.tar
          key: firebase-emulator-${{ hashFiles('dev/firebase/**') }}
      - if: steps.emulator.outputs.cache-hit == 'true'
        run: docker load -q -i "$RUNNER_TEMP/emulator.tar"
      - name: image pulls
        run: |
          until grep -q '^pulled all' "$RUNNER_TEMP/pull.log" || ! kill -0 "$(cat "$RUNNER_TEMP/pull.pid")" 2> /dev/null; do sleep 1; done
          cat "$RUNNER_TEMP/pull.log"
          grep -q '^pulled all' "$RUNNER_TEMP/pull.log"
      - run: npx playwright test --grep "volume \(#479\)" --repeat-each 30
        working-directory: e2e
        env:
          GH_TOKEN: ${{ github.token }} # compat.spec.ts downloads the last gateway release (#459)
      # A miss: global setup built the image; the cache step's post saves this tar.
      - if: steps.emulator.outputs.cache-hit != 'true'
        run: docker save -o "$RUNNER_TEMP/emulator.tar" "$(docker images streamiq-firebase-emulator --format '{{.Repository}}:{{.Tag}}')"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: |
            e2e/logs/
            e2e/test-results/
            e2e/playwright-report/

  # Push to main only: is there a gateway release to make (scripts/next-gateway-version.sh)?
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.c.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags + history
      - uses: ./.github/actions/setup-go # `go list`: what the gateway builds with
      - id: c
        env:
          MSG: ${{ github.event.head_commit.message }} # via env, never inlined into the script
        # [skip release] in the subject defers it: the next release carries the change
        run: |
          v=$(bash scripts/next-gateway-version.sh)
          r=false; [ -n "$v" ] && r=true
          case "${MSG%%$'\n'*}" in *'[skip release]'*) r=false ;; esac
          echo "next gateway version: ${v:-none}, release=$r"
          echo "release=$r" >> "$GITHUB_OUTPUT"

  # #274: a gateway change on main releases itself, but only once every check passed.
  # Add any new check job to `needs`, or it won't gate the release.
  release-gateway:
    needs: [changes, api, frontend, gateway-linux, gateway-windows, gateway-jellyfin, e2e]
    if: needs.changes.outputs.release == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-gateway.yml
