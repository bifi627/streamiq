version: "2"
run:
  # one golangci-lint lock per machine (os.TempDir): wait for it instead of failing after
  # 5 s, so check.sh keeps running concurrently across worktrees
  allow-serial-runners: true
linters:
  # the default set: errcheck, govet, ineffassign, staticcheck, unused; plus gocyclo, funlen,
  # gosec, limited to the HTTP-server checks below, nolintlint (a //nolint
  # that suppresses nothing fails, like oxlint's unused-directive check in the frontend),
  # gocritic (only commentedOutCode), predeclared (a local named min, len, new ...) and
  # forbidigo (time.Sleep in tests)
  enable: [gocyclo, funlen, gosec, nolintlint, gocritic, predeclared, forbidigo]
  exclusions:
    # errcheck skips Close, fmt.Fprint*, os.Remove*, os.Setenv and the like; test
    # files are checked too
    presets: [std-error-handling]
    rules:
      # table tests are long by design; every other linter still checks test files
      - path: _test\.go
        linters: [gocyclo, funlen]
      # time.Sleep outside tests is product timing; testwait is the tests' one polling helper
      - path-except: (_test\.go|^gateway/internal/testwait/)
        linters: [forbidigo]
  settings:
    gosec:
      # G112: an http.Server without ReadHeaderTimeout; G114: a bare http.ListenAndServe/Serve
      # (no timeouts at all). Only these two: the rest of gosec is a separate decision.
      includes: [G112, G114]
    gocritic:
      # CLAUDE.md bans commented-out code; the other checkers are a separate decision
      disable-all: true
      enabled-checks: [commentedOutCode]
    govet:
      # a local hiding an outer variable that is used after it (default, non-strict mode)
      enable: [shadow]
    nolintlint:
      # every //nolint names its linter and says why (an issue or the reason it stays)
      require-explanation: true
      require-specific: true
    forbidigo:
      # a test waits on state, not the wall clock: testing/synctest for timers and channels,
      # testwait.Until for real sockets and WebRTC connections
      forbid:
        - pattern: ^time\.Sleep$
    gocyclo:
      # reports a function over 15, like oxlint's complexity and CA1502;
      # split into pieces that take and return values. A //nolint:gocyclo needs a reason.
      min-complexity: 15
    funlen:
      # a function over 80 lines (about one screen), comments not counted; the frontend's
      # limit is 150. A //nolint:funlen names the issue that splits it or the reason it stays.
      lines: 80
      statements: -1
      ignore-comments: true
    staticcheck:
      # golangci-lint's default checks (setting the list replaces them, so they're restated) ...
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022",
        # ... minus ST1005 (lowercase error strings): ours are capitalized CLI messages the
        # user reads as is ("Jellyfin …", "Docker …"), not strings wrapped inside other errors
        "-ST1005"]
formatters:
  # gofmt never wraps; golines wraps at 120 columns (long string literals stay whole).
  # `golangci-lint run` (check.sh, CI) reports unformatted files; `golangci-lint fmt ./...` (from the repo root) fixes
  # them; rerun it until git shows no change: a long condition can take two or three passes.
  enable: [golines]
  settings:
    golines:
      max-len: 120
