# Optional Jellyfin for StreamIQ: just Jellyfin, pinned to the version this
# gateway release was tested with. Edit the media folders below (this file is
# yours; updates never overwrite it), then run `gateway jellyfin up` (or
# `docker compose -f jellyfin-compose.yml up -d`). `gateway jellyfin upgrade`
# moves the image below to the gateway's tested version.
#
# Leave Jellyfin's setup wizard alone: the gateway completes it, creates the
# admin user and shows its password on the gateway's local page
# (http://localhost:8097).
#
# Offline (default): Jellyfin sits on a network with no way out, so nothing
# about your media (titles, people) reaches TMDb or anyone else; the forwarder
# below is the only way in. `gateway jellyfin offline off` allows online lookups
# (posters, descriptions), `on` turns the jail back on. Those commands switch the
# "# streamiq:..." blocks; keep their marker lines if you edit by hand.
name: streamiq-jellyfin
services:
  jellyfin:
    # Pinned deliberately, never `latest` (the gateway warns on another version).
    image: jellyfin/jellyfin:12.4.20261026-211555
    restart: unless-stopped
    # streamiq:online
    # ports:
      # - "8096:8096"
    # streamiq:online end
    # streamiq:jail
    networks: [jail]
    # streamiq:jail end
    volumes:
      # Jellyfin's users, libraries and watch state, in a folder next to this
      # file: Docker cleanups (prune, Docker Desktop "Clean up data") delete
      # named volumes, not this folder. The cache can go.
      - ./jellyfin-config:/config
      - cache:/cache
      # Media folders, read-only. One entry per folder, any number of drives.
      # Windows paths work as-is, e.g. source: 'D:\Movies'.
      - type: bind
        source: ./media
        target: /media/media
        read_only: true
      # - type: bind
      #   source: 'D:\Movies'
      #   target: /media/movies
      #   read_only: true
    # GPU transcoding (optional; see "GPU transcoding" in docs/install.md).
    # NVIDIA (Windows Docker Desktop, or Linux with the NVIDIA Container Toolkit):
    # `gateway jellyfin gpu nvidia` switches this block on, `gpu off` off again.
    # streamiq:gpu-nvidia
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    # streamiq:gpu-nvidia end
    # Intel / AMD on Linux (VA-API / QSV). Not available in Docker on Windows:
    # devices:
    #   - /dev/dri:/dev/dri
  # Offline: the only way in to Jellyfin. Its ports: are the ones Jellyfin
  # publishes when online.
  # streamiq:jail
  forwarder:
    image: alpine/socat:1.8.0.3
    restart: unless-stopped
    command: tcp-listen:8096,fork,reuseaddr tcp-connect:jellyfin:8096
    depends_on: [jellyfin]
    ports:
      - "8096:8096"
    networks: [jail, default]
  # streamiq:jail end
volumes:
  cache:
# streamiq:jail
networks:
  jail:
    internal: true
# streamiq:jail end
